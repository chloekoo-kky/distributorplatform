server {
    listen 80;
    server_name _;
    # /static/foo -> /vol/web/static/foo ; /media/foo -> /vol/web/media/foo
    # Use root (not alias + try_files). The latter 404s static/media in nginx.
    root /vol/web;

    # Default for normal uploads; backup restore uses a higher limit below.
    client_max_body_size 50M;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    location /static/ {
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location /media/ {
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location /inventory/upload-supplier-price-matrix/ {
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_pass http://app:8324;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Full site backup create/download and restore (DB + media zip).
    location /admin/backup/ {
        client_max_body_size 1024M;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_pass http://app:8324;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location / {
        proxy_pass http://app:8324;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
